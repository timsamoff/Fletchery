<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fletchery</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <script type="importmap">
      { "imports": { "yaml": "/vendor/yaml/index.js" } }
    </script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">
          <img src="/icon.svg" alt="" width="48" height="48" />
          <span>Fletchery</span>
        </a>
        <p class="project-title" id="project-title"></p>
        <button type="button" class="header-button" id="settings-open">Settings</button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="wrap" id="view">
        <p>Loading…</p>
      </div>
    </main>

    <dialog class="settings-drawer" id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-inner">
        <div class="settings-bar">
          <h2 id="settings-title">Settings</h2>
          <button type="button" class="button" id="settings-close">Done</button>
        </div>
        <div class="settings-body" id="settings-body"></div>
      </div>
    </dialog>

    <footer class="site-footer">
      <div class="wrap">
        <p class="project-path" id="project-path"></p>
        <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
        <button type="button" class="button button-quiet" id="grid-toggle" aria-pressed="false">Show grid</button>
      </div>
    </footer>
  </body>
</html>
