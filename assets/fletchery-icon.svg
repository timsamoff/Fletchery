<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Fletchery icon</title>
  <desc id="d">A square book cover with a spine and a double frame. An upright arrow with feathered fletching in rust orange is centered inside the frame.</desc>
  <!-- cover -->
  <rect x="24" y="24" width="464" height="464" rx="28" fill="#2A2D32"/>
  <!-- spine -->
  <path d="M52 24 H76 V488 H52 A28 28 0 0 1 24 460 V52 A28 28 0 0 1 52 24 Z" fill="#1D1F23"/>
  <path d="M76 24 V488" stroke="#3B3F46" stroke-width="2"/>
  <g stroke="#E0601E" stroke-opacity=".75" stroke-width="3" stroke-linecap="round">
    <path d="M38 96 H62 M38 104 H62 M38 408 H62 M38 416 H62"/>
  </g>
  <!-- cover frame, centered on the cover face (x 76-488) -->
  <rect x="122" y="56" width="320" height="400" rx="6" fill="none" stroke="#E0601E" stroke-opacity=".55" stroke-width="2"/>
  <rect x="130" y="64" width="304" height="384" rx="3" fill="none" stroke="#E0601E" stroke-opacity=".3" stroke-width="1.5"/>
  <!-- arrow with fletching, bounding box centered at (282, 256) -->
  <defs><clipPath id="v"><path d="M266,262 C276,270 296,292 302,318 L302,384 C302,398 288,410 266,418 Z"/><path d="M266,262 C256,270 236,292 230,318 L230,384 C230,398 244,410 266,418 Z"/></clipPath></defs>
  <g transform="translate(16 -9)">
    <g fill="#E0601E">
      <path d="M266,104 L275,138 H257 Z"/>
      <rect x="263" y="136" width="6" height="290" rx="2"/>
      <path d="M266,262 C276,270 296,292 302,318 L302,384 C302,398 288,410 266,418 Z"/><path d="M266,262 C256,270 236,292 230,318 L230,384 C230,398 244,410 266,418 Z"/>
    </g>
    <g stroke="#2A2D32" stroke-width="3" stroke-linecap="round" fill="none" clip-path="url(#v)"><path d="M270,320 L306,296"/><path d="M262,320 L226,296"/><path d="M270,334 L306,310"/><path d="M262,334 L226,310"/><path d="M270,348 L306,324"/><path d="M262,348 L226,324"/><path d="M270,362 L306,338"/><path d="M262,362 L226,338"/><path d="M270,376 L306,352"/><path d="M262,376 L226,352"/><path d="M270,390 L306,366"/><path d="M262,390 L226,366"/><path d="M270,404 L306,380"/><path d="M262,404 L226,380"/><path d="M270,418 L306,394"/><path d="M262,418 L226,394"/></g>
  </g>
</svg>
